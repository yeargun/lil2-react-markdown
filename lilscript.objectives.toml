# Objective builds of the browser build (the `browser` condition), raw and gzip, for the size comparison; the
# shipped dist/browser build is the Brotli objective.: named character references are decoded by the document.
# lil2-react-markdown: react-markdown on the typed, flat lil2 pipeline. Compiler-owned delivery.
[policy]
version = 3

[policy.tactics]
# Permit one-time constant-table decoding (the entity table) for smaller downloads.
startup-reconstruction = "on"
recurring-reconstruction = "off"
string-array-packing = "off"

[javascript]
priority = "size-first"
assume_pristine_builtins = true
strip_debug = true
assume_pure_property_reads = true
assume_unconstructed_callbacks = true

[effort]
level = 12

[objective]
codecs = ["raw", "gzip"]

[mangle]
identifiers = true
properties = true
pool_strings = true

[defines]
BROWSER = true

[delivery]
# Functions created at load are `function`, which engines parse on first call (V8 parses arrows at import).
lazy_functions = true
mode = "single"
directory = "objectives"
entry_names = "[name].js"

[delivery.entries]
react-markdown = "src/index.lil"
constants = "src/constants.lil"
gfm = "src/entry-gfm.lil"
full = "src/entry-full.lil"
